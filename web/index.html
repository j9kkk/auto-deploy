<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>AutoDeploy · 自动部署控制台</title>
<link rel="icon" href="/favicon.ico">
<link rel="stylesheet" href="/assets/style.css?v=__VERSION__">
</head>
<body>

<!-- ------------------------------------------------------------------ login -->
<div id="login-view" class="hidden">
  <form class="login-card" id="login-form" autocomplete="on">
    <div class="login-brand">
      <svg class="logo" viewBox="0 0 24 24" fill="none" stroke="#4c8dff" stroke-width="1.8"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2v6"></path><path d="m5 9 7 4 7-4"></path>
        <path d="M5 9v6l7 4 7-4V9"></path>
      </svg>
      <h1>AutoDeploy</h1>
    </div>
    <p class="login-sub">GitHub 自动拉取与部署控制台</p>

    <div id="login-error" class="alert error hidden"></div>
    <div id="login-info" class="alert info hidden"></div>

    <div class="field">
      <label for="username">用户名</label>
      <input type="text" id="username" name="username" autocomplete="username"
             placeholder="admin" required autofocus>
    </div>
    <div class="field">
      <label for="password">密码</label>
      <input type="password" id="password" name="password" autocomplete="current-password"
             placeholder="请输入密码" required>
    </div>
    <button type="submit" class="primary" id="login-submit" style="width:100%;justify-content:center">
      登录
    </button>
    <p class="faint center" style="margin-top:14px">
      首次启动的管理员密码已打印在服务端控制台
    </p>
  </form>
</div>

<!-- -------------------------------------------------------------- main app -->
<div id="app-view" class="hidden">
  <header class="topbar">
    <div class="brand">
      <svg class="logo" viewBox="0 0 24 24" fill="none" stroke="#4c8dff" stroke-width="1.8"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2v6"></path><path d="m5 9 7 4 7-4"></path>
        <path d="M5 9v6l7 4 7-4V9"></path>
      </svg>
      <span>AutoDeploy</span>
    </div>
    <nav class="nav" id="nav">
      <button class="nav-item" data-view="dashboard">总览</button>
      <button class="nav-item" data-view="tasks">任务</button>
      <button class="nav-item" data-view="runs">运行记录</button>
      <button class="nav-item" data-view="credentials">凭据</button>
      <button class="nav-item" data-view="stats">统计</button>
      <button class="nav-item" data-view="settings">设置</button>
    </nav>
    <div class="user-area">
      <span id="scheduler-status" class="badge neutral" title="调度器状态">调度器</span>
      <span class="avatar" id="user-avatar">A</span>
      <span class="dim" id="user-name" style="font-size:13px"></span>
      <button class="ghost" id="logout-btn" title="退出登录">退出</button>
    </div>
  </header>

  <main class="content" id="content">
    <div class="loading-block"><span class="spinner"></span> 加载中…</div>
  </main>
</div>

<!-- ------------------------------------------------------------------ modal -->
<div id="modal-root"></div>
<div id="toasts"></div>

<script src="/assets/util.js?v=__VERSION__"></script>
<script src="/assets/views.js?v=__VERSION__"></script>
<script src="/assets/app.js?v=__VERSION__"></script>
</body>
</html>
