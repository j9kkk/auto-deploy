name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test:
    name: 自检与静态检查 (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install httpx pyflakes

      - name: 配置 git 身份（自检脚本会创建本地仓库）
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"

      - name: 静态检查 (pyflakes)
        run: python -m pyflakes app/ tests/

      - name: JavaScript 语法检查
        run: |
          for f in web/assets/*.js; do node --check "$f"; done

      - name: Shell 语法检查
        run: |
          bash -n run.sh
          bash -n scripts/install.sh
          bash -n scripts/uninstall.sh
          bash -n scripts/bootstrap.sh

      - name: 运行自检
        run: python tests/selfcheck.py

  smoke:
    name: 启动冒烟测试
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 启动服务并检查健康接口
        run: |
          ./run.sh --no-browser --port 8799 --initial-password 'CiSmoke1!pass' \
            --data-dir "$RUNNER_TEMP/data" &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8799/api/health > /tmp/health.json; then
              cat /tmp/health.json
              exit 0
            fi
            sleep 1
          done
          echo "服务未能在 30 秒内启动" >&2
          exit 1

      - name: 检查静态资源可访问
        run: |
          for path in / /assets/style.css /assets/app.js /assets/util.js /assets/views.js; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:8799$path")
            echo "$path -> $code"
            [ "$code" = "200" ] || exit 1
          done

      - name: 未登录访问必须被拒绝
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8799/api/tasks)
          echo "/api/tasks -> $code"
          [ "$code" = "401" ] || exit 1
