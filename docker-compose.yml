# AutoDeploy —— Docker Compose 部署。
# 一键脚本自动下载本文件并拉取 GHCR 预构建镜像（--no-build 启动）；
# 本地开发在仓库根目录执行 docker compose up --build 自行构建。
# 端口通过同目录 .env 的 AUTODEPLOY_PORT 调整（scripts/bootstrap.sh 会自动写入）。
# 固定项目名，保证数据卷名与部署目录名无关。
name: auto-deploy

services:
  autodeploy:
    image: ${AUTODEPLOY_IMAGE:-ghcr.io/j9kkk/auto-deploy}:${AUTODEPLOY_IMAGE_TAG:-latest}
    build: .
    container_name: auto-deploy
    restart: unless-stopped
    init: true
    ports:
      - "${AUTODEPLOY_PORT:-8770}:8770"
    volumes:
      - autodeploy-data:/app/data
      # 任务需要使用「Docker / Docker Compose」部署方式时，在 docker-compose.override.yml
      # 中挂载宿主机 Docker socket（一键脚本升级不会覆盖 override 文件，写法见 README）：
      # - /var/run/docker.sock:/var/run/docker.sock

volumes:
  autodeploy-data:
